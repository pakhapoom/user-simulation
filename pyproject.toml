[project]
name = "user-simulation"
version = "0.1.0"
description = "LLM agents that simulate user decisions, evaluated on real recommendation data"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.5.4",
    "pandas>=3.1.0",
    "scikit-learn>=1.9.1",
    "scipy>=1.18.1",
]

[project.optional-dependencies]
laya = [
    "laya>=0.4.15",
]

[project.scripts]
user-sim = "user_simulation.cli:main"

[build-system]
requires = ["uv_build>=0.11,<0.12"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
]
